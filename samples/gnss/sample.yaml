sample:
  name: GNSS fixes from an Android phone
tests:
  sample.gnss.native_sim:
    tags:
      - gnss
    platform_allow:
      - native_sim/native/64
    integration_platforms:
      - native_sim/native/64
    extra_configs:
      - CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="-gnss_position=52.370216,4.895168,12"
    harness: console
    harness_config:
      type: one_line
      regex:
        - "lat 52\\.370216 N  lon 4\\.895168 E  alt 12\\.0 m"
