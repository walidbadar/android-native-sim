# zspot on the phone. Use with: west build --arch aarch64 zspot/app --extra-conf <this file>

# /dev/net/tun is denied without root: use host sockets instead of TAP
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_L2_ETHERNET=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# No aplay on the phone: write the audio to i2s_out.pcm
CONFIG_ZSPOT_PCM_COMMAND=""

# Otherwise the window turns black after a minute without a touch
CONFIG_ZSPOT_SCREEN_TIMEOUT_SECONDS=0
